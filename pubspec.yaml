name: gulf_car_auction
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.1.0+15

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6

  # Local Storage
  shared_preferences: ^2.3.2

  # Network
  http: ^1.2.2
  connectivity_plus: ^6.1.3
  pusher_channels_flutter:
    git:
      url: https://github.com/Pritom-Shajed/pusher-channels-flutter
      ref: master

  # Pickers
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  country_code_picker: ^3.0.0
  dropdown_flutter: ^1.0.1

  # Env
  flutter_dotenv: ^5.1.0

  # Utils
  loader_overlay: ^4.0.1
  flutter_spinkit: ^5.2.1
  fluttertoast: ^8.2.12
  modal_bottom_sheet: ^3.0.0
  text_scroll: ^0.2.0
  device_preview: ^1.2.0
  intl: ^0.20.2
  audioplayers: ^6.4.0
  syncfusion_flutter_pdfviewer: ^29.1.35
  photo_view: ^0.15.0
  syncfusion_flutter_calendar: ^29.1.35
  flutter_widget_from_html: ^0.15.2
  flutter_media_downloader:
    git:
      url: https://github.com/Pritom-Shajed/flutter_media_downloader.git
      ref: master

  # Image
  flutter_svg: ^2.0.10+1

  #  Stepper
  another_stepper: ^1.2.2

  #  OTP
  pinput: ^5.0.0

  #  Design
  dotted_border: ^2.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  dynamic_height_grid_view: ^0.0.4 # https://pub.dev/packages/dynamic_height_grid_view
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.11.0
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  google_maps_flutter: ^2.12.1
  upgrader: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/png/app_logo_ios.jpg"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
   - assets/icons/flag/
   - assets/icons/png/
   - assets/icons/svg/
   - assets/particles/
   - assets/sounds/
   - env.dev
   - env.production


  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish.ttf
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald/oswald.ttf
        - asset: assets/fonts/oswald/oswald-bold.ttf
          weight: 700

